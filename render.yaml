# Render Blueprint – ZodiacPatent Attorney Email Automation (backend API)
#
# One Web Service on the FREE plan, without a persistent disk.
# Sending history, the shared workbook, template, column mapping, in-flight send
# claims and team activity are stored in MongoDB Atlas (M0 Free), so they survive
# restarts, sleep and redeploys. Only sign-in sessions live in the temporary app
# folder: after a restart or sleep, team members simply sign in again.
# REQUIRE_MONGODB=true makes the server refuse to start without the database,
# and in production it connects BEFORE serving: a wrong MONGODB_URI, or Atlas
# Network Access not allowing Render, fails the deploy (the previous version
# keeps running) instead of going live broken.
# Do NOT set DATA_DIR without a disk: the server would refuse to start.
# Secrets marked "sync: false" are NOT stored here: Render asks for them when the
# Blueprint is first applied (or set them under Service → Environment).
# See DEPLOYMENT.md for the full procedure.
services:
  - type: web
    name: zodiacpatent-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: false        # deploy manually from the Render dashboard; see DEPLOYMENT.md to enable auto-deploy
    # One instance (the free plan's limit). Send claims and history are safe across
    # instances (MongoDB), but sign-in sessions are kept per instance.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # The browser only talks to the Vercel site; Vercel forwards /api/* here
      # (frontend/vercel.json). The browser's Origin is therefore the Vercel site.
      - key: FRONTEND_URL
        value: https://automailzp.vercel.app
      # Host names accepted on incoming requests (Render's own *.onrender.com
      # name is also added automatically). The Vercel name is listed in case the
      # proxy passes the original Host header through.
      - key: ALLOWED_HOSTS
        value: automailzp.onrender.com,automailzp.vercel.app
      # Trust exactly ONE proxy hop: Render's own load balancer, which records the
      # address that actually connected. Higher values would let anyone who calls
      # the Render URL directly forge X-Forwarded-For and dodge the login limiter.
      - key: TRUST_PROXY
        value: "1"
      # Shared team login
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false           # generate locally: cd backend && npm run hash-password
      - key: SESSION_SECRET
        generateValue: true   # random value generated by Render
      - key: SESSION_IDLE_HOURS
        value: "2"
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      # Email sending. Render Free blocks outgoing SMTP ports, so emails go out
      # through the Resend HTTPS API. The key stays on Render only (never sent to
      # Vercel or the browser). SMTP_FROM is the sender address; its domain must
      # be verified in Resend.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false           # e.g. vikram@zodiacpatent.com
      # Shared database (MongoDB Atlas M0 Free). The connection string is a secret:
      # set it in the Render dashboard only. Atlas Network Access must allow
      # 0.0.0.0/0 (Render Free has no fixed outgoing IP address).
      - key: REQUIRE_MONGODB
        value: "true"
      - key: MONGODB_URI
        sync: false           # mongodb+srv://<user>:<password>@<cluster>/?retryWrites=true&w=majority
      - key: MONGODB_DB
        value: automail
      # Names offered in "Who is using this browser?" (self-declared, audited).
      - key: TEAM_MEMBERS
        value: Vikram, Vikram2
      # Proxies in front of the backend for the activity log's reported client IP
      # (Vercel's proxy + Render's load balancer).
      - key: AUDIT_CLIENT_IP_HOPS
        value: "2"

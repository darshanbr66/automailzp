# Render Blueprint – ZodiacPatent Attorney Email Automation (backend API)
#
# One paid Web Service with a persistent disk mounted at /var/data.
# Secrets marked "sync: false" are NOT stored here: Render asks for them when the
# Blueprint is first applied (or set them under Service → Environment).
# See DEPLOYMENT.md for the full procedure.
services:
  - type: web
    name: zodiacpatent-api
    runtime: node
    plan: starter            # paid instance type (persistent disks require a paid plan)
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: false        # deploy manually from the Render dashboard; see DEPLOYMENT.md to enable auto-deploy
    # A service with a disk always runs as ONE instance. Never scale this
    # service out: the history workbook, locks and sessions assume a single process.
    disk:
      name: zodiacpatent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_URL
        value: https://app.zodiacpatent.com
      - key: ALLOWED_HOSTS
        value: api.zodiacpatent.com
      - key: TRUST_PROXY
        value: "1"
      # Shared team login
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false           # generate locally: cd backend && npm run hash-password
      - key: SESSION_SECRET
        generateValue: true   # random value generated by Render
      - key: SESSION_IDLE_HOURS
        value: "2"
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      # Hostinger SMTP (kept on Render only; never sent to Vercel or the browser)
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

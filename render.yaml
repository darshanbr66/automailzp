# Render Blueprint – ZodiacPatent Attorney Email Automation (backend API)
#
# One Web Service on the FREE plan, without a persistent disk.
# Without a disk, history, templates, column mapping and sessions are stored in
# the app folder and are LOST on every restart, sleep (Free instances spin down
# when idle) and redeploy. See DEPLOYMENT.md, "Render Free: what is not kept".
# To keep data later: switch to a paid plan, add a disk at /var/data and set
# DATA_DIR=/var/data (do NOT set DATA_DIR without a disk: the server will refuse to start).
# Secrets marked "sync: false" are NOT stored here: Render asks for them when the
# Blueprint is first applied (or set them under Service → Environment).
# See DEPLOYMENT.md for the full procedure.
services:
  - type: web
    name: zodiacpatent-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: false        # deploy manually from the Render dashboard; see DEPLOYMENT.md to enable auto-deploy
    # Run ONE instance only: the history workbook, locks and sessions assume a single process.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_URL
        value: https://app.zodiacpatent.com
      - key: ALLOWED_HOSTS
        value: api.zodiacpatent.com
      - key: TRUST_PROXY
        value: "1"
      # Shared team login
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false           # generate locally: cd backend && npm run hash-password
      - key: SESSION_SECRET
        generateValue: true   # random value generated by Render
      - key: SESSION_IDLE_HOURS
        value: "2"
      - key: SESSION_MAX_AGE_HOURS
        value: "12"
      # Hostinger SMTP (kept on Render only; never sent to Vercel or the browser)
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
